name: Release

# Publishes a GitHub Release (with SHA-256 checksums) for every version tag.
#
#   git tag v21.0.0     # must match `version` in Cargo.toml
#   git push origin v21.0.0

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # ---------------------------------------------------------------------------
  # 1. Sanity checks: the tag must match the crate version, and tests must pass.
  # ---------------------------------------------------------------------------
  verify:
    name: Verify tag & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Check that the tag matches Cargo.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n1)"
          echo "tag=$tag crate=$version"
          if [ -z "$version" ]; then
            echo "::error::Could not read the version from Cargo.toml."
            exit 1
          fi
          if [ "$tag" != "$version" ]; then
            echo "::error::Tag v$tag does not match Cargo.toml ($version). Bump the crate version and re-tag."
            exit 1
          fi

      - name: Test
        run: cargo test --all-targets

  # ---------------------------------------------------------------------------
  # 2. Build the Windows binaries and package them.
  # ---------------------------------------------------------------------------
  build:
    name: Build (${{ matrix.arch }})
    needs: verify
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            arch: x64
          - target: i686-pc-windows-msvc
            arch: x86
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Smoke test (--version)
        shell: pwsh
        run: |
          & "target/${{ matrix.target }}/release/idm-trial-reset.exe" --version

      - name: Package
        shell: pwsh
        run: |
          $tag    = "${{ github.ref_name }}"
          $name   = "idm-trial-reset-$tag-windows-${{ matrix.arch }}"
          $stage  = Join-Path $env:RUNNER_TEMP $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/${{ matrix.target }}/release/idm-trial-reset.exe" $stage
          Copy-Item "README.md"  $stage
          Copy-Item "LICENSE"    $stage

          # A plain-text reminder that travels with the binary.
          $disclaimer = @(
            "USE AT YOUR OWN RISK - FOR EDUCATIONAL PURPOSES ONLY."
            ""
            "This tool is not a crack, keygen or patch and it never modifies"
            "Internet Download Manager's binaries. IDM is commercial software"
            "owned by Tonec FZE; this project is not affiliated with, endorsed by"
            "or sponsored by Tonec FZE. If you find IDM useful, buy a genuine"
            "license: https://www.internetdownloadmanager.com/buy.html"
            ""
            "Verify this archive against SHA256SUMS.txt before running it."
          )
          Set-Content -Path (Join-Path $stage "DISCLAIMER.txt") -Value $disclaimer -Encoding utf8

          $dist = Join-Path $env:GITHUB_WORKSPACE "dist"
          New-Item -ItemType Directory -Force -Path $dist | Out-Null
          Compress-Archive -Path "$stage/*" -DestinationPath (Join-Path $dist "$name.zip") -CompressionLevel Optimal

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.arch }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Checksum everything and publish the release.
  # ---------------------------------------------------------------------------
  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download the packaged archives
        uses: actions/download-artifact@v4
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true

      - name: Generate SHA256SUMS.txt
        working-directory: dist
        run: |
          shopt -s nullglob
          files=(*.zip)
          if [ ${#files[@]} -eq 0 ]; then
            echo "::error::No archives to publish."
            exit 1
          fi
          sha256sum "${files[@]}" > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Build the release notes
        run: |
          tag="$GITHUB_REF_NAME"
          {
            echo "## idm-trial-reset $tag"
            echo
            echo "> [!WARNING]"
            echo "> **Educational use only.** This tool is not a crack, keygen or patch and it never modifies IDM's binaries. Internet Download Manager is commercial software owned by [Tonec FZE](https://www.internetdownloadmanager.com/); this project is not affiliated with, endorsed by or sponsored by Tonec FZE. **If you find IDM useful, [buy a genuine license](https://www.internetdownloadmanager.com/buy.html).** You are solely responsible for complying with the laws that apply to you. Use it at your own risk."
            echo
            echo "## Assets"
            echo
            echo "| File | SHA-256 |"
            echo "| --- | --- |"
            awk '{ printf "| `%s` | `%s` |\n", $2, $1 }' dist/SHA256SUMS.txt
            echo
            echo "The same hashes are available in \`SHA256SUMS.txt\`."
            echo
            echo "## Verify the download"
            echo
            echo '```bash'
            echo "sha256sum -c SHA256SUMS.txt"
            echo '```'
            echo
            echo "PowerShell:"
            echo
            echo '```powershell'
            echo "Get-FileHash .\idm-trial-reset-$tag-windows-x64.zip -Algorithm SHA256"
            echo "Get-Content .\SHA256SUMS.txt"
            echo '```'
            echo
            echo "## Install"
            echo
            echo "1. Download the archive that matches your architecture (x64 for 64-bit Windows, x86 for 32-bit Windows)."
            echo "2. Verify its SHA-256 against \`SHA256SUMS.txt\`."
            echo "3. Extract it anywhere and run \`idm-trial-reset.exe\` — the tool asks for elevation itself."
            echo
            echo '```console'
            echo "$ idm-trial-reset trial --help"
            echo "Usage: idm-trial-reset trial [OPTIONS]"
            echo
            echo "Options:"
            echo "      --auto             Only reset when the scheduled reset date has been reached"
            echo "      --autorun          Also schedule an automatic reset 15 days from now"
            echo "      --no-update-check  Do not contact the update server afterwards"
            echo '```'
            echo
            echo "See the [README](https://github.com/$GITHUB_REPOSITORY#readme) for the full documentation."
            echo
            echo "### Checksums"
            echo
            echo '```'
            cat dist/SHA256SUMS.txt
            echo '```'
          } > notes.md

      - name: Create the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "idm-trial-reset $GITHUB_REF_NAME" \
            --notes-file notes.md
